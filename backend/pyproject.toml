[project]
name = "kidnap-children-backend"
version = "2.0.0"
description = "Kidnap-children v2 - FastAPI modular monolith (PostgreSQL, S3 presigned media, matching worker)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.35",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "email-validator>=2.2,<3",
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<3.3",
  "pyjwt>=2.9,<3",
  "argon2-cffi>=23.1,<26",
  "boto3>=1.35,<2",
  "httpx>=0.27,<0.29",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
  "pillow>=10.4,<12",
  "boto3-stubs[s3]>=1.35,<2",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
plugins = []

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP046"]
