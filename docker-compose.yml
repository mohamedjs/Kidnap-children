services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kidnap_app
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - .:/var/www/html
    networks:
      - kidnap_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: kidnap_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kidnap_net
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: kidnap_ai_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./ai_service/app:/app/app
      - ai_data:/app/data
    networks:
      - kidnap_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  queue:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    container_name: kidnap_queue
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - .:/var/www/html
    networks:
      - kidnap_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/scheduler/Dockerfile
    container_name: kidnap_scheduler
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - .:/var/www/html
    networks:
      - kidnap_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    container_name: kidnap_db
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kidnap_children}
      MYSQL_USER: ${DB_USERNAME:-kidnap_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "33066:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - kidnap_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD || mysqladmin ping -h 127.0.0.1 -u root -psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    container_name: kidnap_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - kidnap_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  kidnap_net:
    driver: bridge

volumes:
  dbdata:
  redisdata:
  ai_data:
